<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Affirmation Machine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            /* DISTANCE EACH HALF MOVES WHEN OPENING */
            --opening: 90px;

            /* OPENING SPEED */
            --split-speed: 0.4s;

            /* DEPARTURE SPEED AFTER AUDIO STARTS */
            --departure-speed: 2s;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;

            cursor:
                url("./design/logo_cursor.svg") 16 16,
                url("./design/cursor.png") 16 16,
                auto;
        }

        .stage {
            height: 100svh;
            overflow: hidden;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;

            padding: 20px;
            visibility: hidden;
        }
        .stage.ready {visibility: visible;}

        .instruction {
            margin: 0;
            text-align: center;

           ##hmmmm aici nush 
            font-family: Georgia, serif;
            font-size: clamp(18px, 4vw, 24px);

            flex-shrink: 0;
        }

        .desktop-instruction {
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .desktop-instruction {
                display: inline;
            }

            .touch-instruction {
                display: none;
            }
        }

        .machine {
            position: relative;
            flex-shrink: 0;

            /* MAXIMUM IMAGE WIDTH */
            max-width: 550px;
            width: 100%;
        }

        .image-size {
            display: block;
            width: 100%;
            height: auto;
            visibility: hidden;
        }

        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            z-index: 2;
            pointer-events: none;

            transition:
                transform var(--split-speed) ease,
                opacity var(--split-speed) ease;
        }

        .upper {
            top: 0;
        }

        .lower {
            bottom: 0;
        }

        .half img {
            position: absolute;
            left: 0;
            display: block;
            width: 100%;
            height: 200%;
        }

        .upper img {
            top: 0;
        }

        .lower img {
            bottom: 0;
        }

        .content {
            position: absolute;
            inset: 0;
            z-index: 1;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;

            visibility: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .message {
            margin: 0;
            font-size: 20px;
            text-align: center;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        button {
            border: none;
            padding: 15px 25px;
            background: #fff;
            color: #000;
            font-size: 18px;
            cursor: inherit;
        }

        button:focus-visible,
        .machine:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 5px;
        }

        /* OPEN ON TAP OR KEYBOARD FOCUS */
        .machine.open .upper,
        .machine:focus-within .upper {
            transform: translateY(calc(-1 * var(--opening)));
        }

        .machine.open .lower,
        .machine:focus-within .lower {
            transform: translateY(var(--opening));
        }

        .machine.open .content,
        .machine:focus-within .content {
            visibility: visible;
            opacity: 1;
        }

        /* OPEN ON HOVER FOR MOUSE USERS */
        @media (hover: hover) and (pointer: fine) {
            .machine:hover .upper {
                transform: translateY(calc(-1 * var(--opening)));
            }

            .machine:hover .lower {
                transform: translateY(var(--opening));
            }

            .machine:hover .content {
                visibility: visible;
                opacity: 1;
            }
        }

        /* DEPARTURE AFTER AUDIO STARTS */
        .machine.playing .half {
            opacity: 0;

            transition:
                transform var(--departure-speed) ease-in-out,
                opacity var(--departure-speed) ease-in-out;
        }

        .machine.playing .upper {
            transform: translateY(-110svh);
        }

        .machine.playing .lower {
            transform: translateY(110svh);
        }

        .machine.playing .content {
            visibility: visible;
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                --split-speed: 0.01s;
                --departure-speed: 0.01s;
            }
        }
    </style>
</head>

<body>

    <div class="stage">

        <!-- TEXT ABOVE THE IMAGE: CHANGE THESE WORDS -->
        <p class="instruction" id="instruction">
            <span class="desktop-instruction">Hover over to get affirmed.</span>
            <span class="touch-instruction">Tap to get affirmed.</span>
        </p>

        <main
            class="machine"
            id="machine"
            tabindex="0"
            aria-label="Reveal audio choices"
        >

            
            <img
                class="image-size"
                id="cover-size"
                src="./design/cover.png"
                alt=""
                aria-hidden="true"
            >

            <div class="content">

            
                <p class="message">Choose your affirmation.</p>

                <div class="buttons">
                    <button type="button" onclick="playAudio('audio1')">
                        Truth 1
                    </button>

                    <button type="button" onclick="playAudio('audio2')">
                        Truth 2
                    </button>
                </div>

            </div>

            <div class="half upper" aria-hidden="true">
                <img src="./design/cover.png" alt="">
            </div>

            <div class="half lower" aria-hidden="true">
                <img src="./design/cover.png" alt="">
            </div>

        </main>
    </div>

    
    <audio id="audio1" src="./audio1.mp3" preload="none"></audio>
    <audio id="audio2" src="./audio2.mp3" preload="none"></audio>

    <script>
        const machine = document.getElementById("machine");
        const cover = document.getElementById("cover-size");
        const instruction = document.getElementById("instruction");

        /*
         * Fit the whole image below the instruction,
         * preserving the exact proportions of both halves.
         */
        function fitImage() {
            if (!cover.naturalWidth || !cover.naturalHeight) return;

            const stage = document.querySelector(".stage");
            const availableHeight = Math.max(
                1,
                stage.clientHeight - instruction.offsetHeight - 24 - 40
            );

            const availableWidth = Math.max(1, stage.clientWidth - 40);
            const ratio = cover.naturalWidth / cover.naturalHeight;

            machine.style.width =
                Math.min(550, availableWidth, availableHeight * ratio) + "px";
        }

        window.addEventListener("resize", fitImage);

async function showWebsite() {
    const images = document.querySelectorAll(".machine img");

    try {
        await Promise.all(
            Array.from(images, image => image.decode())
        );

        fitImage();

        document.querySelector(".stage").classList.add("ready");
    } catch (error) {
        console.error("Could not load the cover image:", error);
    }
}

showWebsite();

        
        machine.addEventListener("click", (event) => {
            if (!event.target.closest("button")) {
                machine.classList.add("open");
            }
        });

   
        machine.addEventListener("keydown", (event) => {
            if (
                event.target === machine &&
                (event.key === "Enter" || event.key === " ")
            ) {
                event.preventDefault();
                machine.classList.add("open");
            }
        });

        async function playAudio(id) {
            const selected = document.getElementById(id);

            document.querySelectorAll("audio").forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            try {
                await selected.play();
                machine.classList.add("playing");

                // Hide the instruction while keeping its layout space.
                instruction.style.visibility = "hidden";
            } catch (error) {
                console.error("Could not play audio:", error);
            }
        }
    </script>

</body>
</html>
