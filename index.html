<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Affirmation Machine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Georgia, serif;
            cursor: url("./design/cursor.png") 16 16, auto;
        }

        .about {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
        }

        .about img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            50% {
                transform: translateY(-8px);
            }
        }

        .stage {
            height: 100svh;
            padding: 100px 20px 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            visibility: hidden;
        }

        .stage.ready {
            visibility: visible;
        }

        .instruction {
            margin: 0;
            font-size: 22px;
            text-align: center;
        }

        .desktop {
            display: none;
        }

        .machine {
            position: relative;
            flex-shrink: 0;
            width: 100%;
            max-width: 550px;
        }

        .size {
            display: block;
            width: 100%;
            visibility: hidden;
        }

        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
            transition: transform 0.4s, opacity 0.4s;
        }

        .upper {
            top: 0;
        }

        .lower {
            bottom: 0;
        }

        .half img {
            position: absolute;
            left: 0;
            width: 100%;
            height: 200%;
        }

        .upper img {
            top: 0;
        }

        .lower img {
            bottom: 0;
        }

        .choices {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            visibility: hidden;
        }

        button {
            border: none;
            padding: 15px 20px;
            background: white;
            color: black;
            font: inherit;
            cursor: inherit;
        }

        .machine.open .upper,
        .machine:focus-within .upper {
            transform: translateY(-90px);
        }

        .machine.open .lower,
        .machine:focus-within .lower {
            transform: translateY(90px);
        }

        .machine.open .choices,
        .machine:focus-within .choices {
            visibility: visible;
        }

        @media (hover: hover) and (pointer: fine) {
            .desktop {
                display: inline;
            }

            .touch {
                display: none;
            }

            .machine:hover .upper {
                transform: translateY(-90px);
            }

            .machine:hover .lower {
                transform: translateY(90px);
            }

            .machine:hover .choices {
                visibility: visible;
            }
        }

        .machine.playing .half {
            opacity: 0;
            transition: transform 2s, opacity 2s;
        }

        .machine.playing .upper {
            transform: translateY(-110svh);
        }

        .machine.playing .lower {
            transform: translateY(110svh);
        }

        .machine.playing .choices {
            visibility: visible;
        }

        @media (prefers-reduced-motion: reduce) {
            .about img {
                animation: none;
            }

            .half,
            .machine.playing .half {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <a class="about" href="./about.html">
        <img src="./design/logo_cursor.svg" alt="">
        <span>Get to know more</span>
    </a>

    <div class="stage" id="stage">
        <p class="instruction" id="instruction">
            <span class="desktop">Hover over to get affirmed.</span>
            <span class="touch">Tap to get affirmed.</span>
        </p>

        <main class="machine" id="machine" tabindex="0"
              aria-label="Reveal audio choices">

            <img class="size" id="cover"
                 src="./design/cover.png" alt="">

            <div class="choices">
                <button type="button" onclick="playAudio('audio1')">
                    Truth 1
                </button>

                <button type="button" onclick="playAudio('audio2')">
                    Truth 2
                </button>
            </div>

            <div class="half upper" aria-hidden="true">
                <img src="./design/cover.png" alt="">
            </div>

            <div class="half lower" aria-hidden="true">
                <img src="./design/cover.png" alt="">
            </div>
        </main>
    </div>

    <audio id="audio1" src="./audio1.mp3" preload="none"></audio>
    <audio id="audio2" src="./audio2.mp3" preload="none"></audio>

    <script>
        const stage = document.getElementById("stage");
        const machine = document.getElementById("machine");
        const cover = document.getElementById("cover");
        const instruction = document.getElementById("instruction");

        function fitImage() {
            const ratio = cover.naturalWidth / cover.naturalHeight;
            const height = Math.max(
                1,
                stage.clientHeight - instruction.offsetHeight - 164
            );

            machine.style.width =
                Math.min(550, stage.clientWidth - 40, height * ratio) + "px";
        }

        async function showWebsite() {
            try {
                await Promise.all(
                    Array.from(
                        machine.querySelectorAll("img"),
                        image => image.decode()
                    )
                );

                fitImage();
                stage.classList.add("ready");
            } catch {
                instruction.textContent = "The cover image could not load.";
                stage.classList.add("ready");
            }
        }

        machine.addEventListener("click", () => {
            machine.classList.add("open");
        });

        async function playAudio(id) {
            document.querySelectorAll("audio").forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            try {
                await document.getElementById(id).play();
                machine.classList.add("playing");
                instruction.style.visibility = "hidden";
            } catch {
                instruction.textContent = "The audio could not play.";
                instruction.style.visibility = "visible";
            }
        }

        window.addEventListener("resize", () => {
            if (cover.naturalWidth) fitImage();
        });

        showWebsite();
    </script>
</body>
</html>
