<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Affirmation Machine v1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            /* HOW FAR EACH HALF MOVES ON HOVER */
            --opening: 90px;

            /* HOVER ANIMATION SPEED */
            --split-speed: 0.8s;

            /* SPEED WHEN AUDIO IS CLICKED */
            --departure-speed: 3s;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;

            cursor:
                url("./design/logo_cursor.svg") 16 16,
                url("./design/cursor.png") 16 16,
                auto;
        }

        .stage {
            height: 100svh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .machine {
            position: relative;

            /* CHANGE THE IMAGE SIZE HERE */
            width: min(90vw, 550px);
            flex-shrink: 0;
        }

        /*
         * This image sets the exact container proportions.
         * Do not add max-height or object-fit here.
         */
        .image-size {
            display: block;
            width: 100%;
            height: auto;
            visibility: hidden;
        }

        /* Each wrapper contains exactly half of the image */
        .half {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            z-index: 2;

            pointer-events: none;

            transition:
                transform var(--split-speed) ease,
                opacity var(--split-speed) ease;
        }

        .upper {
            top: 0;
        }

        .lower {
            bottom: 0;
        }

        /*
         * Each image is twice the height of its half-wrapper.
         * The upper one aligns to the top; the lower to the bottom.
         */
        .half img {
            position: absolute;
            left: 0;
            display: block;
            width: 100%;
            height: 200%;
        }

        .upper img {
            top: 0;
        }

        .lower img {
            bottom: 0;
        }

        .content {
            position: absolute;
            inset: 0;
            z-index: 1;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;

            visibility: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .message {
            margin: 0;
            font-size: 22px;
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        button {
            border: none;
            padding: 15px 25px;
            background: #fff;
            color: #000;
            font-size: 18px;
            cursor: inherit;
        }

        button:focus-visible,
        .machine:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 5px;
        }

        /* OPEN ON TAP OR KEYBOARD FOCUS */
        .machine.open .upper,
        .machine:focus-within .upper {
            transform: translateY(calc(-1 * var(--opening)));
        }

        .machine.open .lower,
        .machine:focus-within .lower {
            transform: translateY(var(--opening));
        }

        .machine.open .content,
        .machine:focus-within .content {
            visibility: visible;
            opacity: 1;
        }

        /* OPEN ON HOVER */
        @media (hover: hover) {
            .machine:hover .upper {
                transform: translateY(calc(-1 * var(--opening)));
            }

            .machine:hover .lower {
                transform: translateY(var(--opening));
            }

            .machine:hover .content {
                visibility: visible;
                opacity: 1;
            }
        }

        /* MOVE BOTH HALVES OFFSCREEN AFTER AUDIO STARTS */
        .machine.playing .half {
            opacity: 0;

            transition:
                transform var(--departure-speed) ease-in-out,
                opacity var(--departure-speed) ease-in-out;
        }

        .machine.playing .upper {
            transform: translateY(-110svh);
        }

        .machine.playing .lower {
            transform: translateY(110svh);
        }

        .machine.playing .content {
            visibility: visible;
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                --split-speed: 0.01s;
                --departure-speed: 0.01s;
            }
        }
    </style>
</head>

<body>

    <div class="stage">
        <main
            class="machine"
            id="machine"
            tabindex="0"
            aria-label="Reveal audio choices"
        >

            <!-- IMAGE PATH: keep all three paths identical -->
            <img
                class="image-size"
                src="./design/cover.png"
                alt=""
                aria-hidden="true"
            >

            <div class="content">

                <!-- CHANGE YOUR MESSAGE HERE -->
                <p class="message">Choose what you want to hear.</p>

                <div class="buttons">
                    <button type="button" onclick="playAudio('audio1')">
                        Audio 1
                    </button>

                    <button type="button" onclick="playAudio('audio2')">
                        Audio 2
                    </button>
                </div>
            </div>

            <div class="half upper" aria-hidden="true">
                <img src="./design/cover.png" alt="">
            </div>

            <div class="half lower" aria-hidden="true">
                <img src="./design/cover.png" alt="">
            </div>

        </main>
    </div>

    <!-- AUDIO FILE PATHS -->
    <audio id="audio1" src="./audio1.mp3" preload="none"></audio>
    <audio id="audio2" src="./audio2.mp3" preload="none"></audio>

    <script>
        const machine = document.getElementById("machine");

        machine.addEventListener("click", () => {
            machine.classList.add("open");
        });

        async function playAudio(id) {
            const selected = document.getElementById(id);

            document.querySelectorAll("audio").forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            try {
                await selected.play();
                machine.classList.add("playing");
            } catch (error) {
                console.error("Could not play audio:", error);
            }
        }
    </script>

</body>
</html>
