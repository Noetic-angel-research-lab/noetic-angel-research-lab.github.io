<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Affirmation Machine v1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            background: #000000;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            /*
             * CURSOR:
             * Paths are relative to index.html.
             * Use a small cursor image, ideally 32 × 32 pixels.
             * 16 16 places the click point at its centre.
             * Change the logo colour inside the SVG file.
             */
            cursor:
                url("./design/logo_cursor.svg") 16 16,
                url("./design/cursor.png") 16 16,
                auto;
        }

        .machine {
            position: relative;

            /* IMAGE SIZE: change these values */
            width: min(90vw, 550px);
        }

        .cover {
            display: block;
            width: 100%;
            padding: 0;
            border: none;
            background: #000000;
            cursor: inherit;

            transition: opacity 0.3s ease;
        }

        .cover img {
            display: block;
            width: 100%;
            max-height: 90svh;
            object-fit: contain;
        }

        .content {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;

            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .message {
            margin: 0;
            text-align: center;
            font-size: 24px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .audio-button {
            background: #ffffff;
            color: #000000;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: inherit;
        }

        /* Reveal with keyboard focus or a tap */
        .machine:focus-within .cover,
        .machine.revealed .cover {
            opacity: 0;
            pointer-events: none;
        }

        .machine:focus-within .content,
        .machine.revealed .content {
            opacity: 1;
            visibility: visible;
        }

        /* Reveal on hover for devices with a mouse */
        @media (hover: hover) {
            .machine:hover .cover {
                opacity: 0;
                pointer-events: none;
            }

            .machine:hover .content {
                opacity: 1;
                visibility: visible;
            }
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 6px;
        }
    </style>
</head>

<body>

    <main class="machine" id="machine">

        <!-- COVER IMAGE: change the path here -->
        <button
            class="cover"
            type="button"
            aria-label="Reveal the audio choices"
            onclick="document.getElementById('machine').classList.add('revealed')"
        >
            <img
                src="./design/cover.png"
                alt="I can see that you can see the truth"
            >
        </button>

        <div class="content">

            <!-- HOVER MESSAGE: change the text here -->
            <p class="message">Choose what you want to hear.</p>

            <div class="buttons">
                <button
                    class="audio-button"
                    type="button"
                    onclick="playAudio('audio1')"
                >
                    Audio 1
                </button>

                <button
                    class="audio-button"
                    type="button"
                    onclick="playAudio('audio2')"
                >
                    Audio 2
                </button>
            </div>

        </div>
    </main>

    <!-- AUDIO FILES: paths relative to index.html -->
    <audio id="audio1" src="./audio1.mp3" preload="none"></audio>
    <audio id="audio2" src="./audio2.mp3" preload="none"></audio>

    <script>
        async function playAudio(id) {
            const selected = document.getElementById(id);

            document.querySelectorAll("audio").forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            try {
                await selected.play();
            } catch (error) {
                console.error("Could not play the audio:", error);
            }
        }
    </script>

</body>
</html>
