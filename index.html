

<!DOCTYPE html>
<html lang="en"> #muahhh
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Affirmation Machine v1</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000000;

            display: flex;
            justify-content: center;
            align-items: center;

            
            cursor: url("design/logo_cursor.svg.svg") 16 16, auto;
        }

        .buttons {
            display: flex;
            gap: 20px; 
        }

        button {
            background-color: #ffffff;
            color: #000000;
            padding: 15px 30px;

            font-size: 18px;

            border: none;
            cursor: inherit;
        }
    </style>
</head>

<body>

    <div class="buttons">
        <button onclick="playAudio('audio1')">
            Audio 1
        </button>

        <button onclick="playAudio('audio2')">
            Audio 2
        </button>
    </div>

    ##source audio
    <audio id="audio1" src="audio1.mp3"></audio>
    <audio id="audio2" src="audio2.mp3"></audio>
    
    
    ###stop/play
    <script>
        function playAudio(id) {
            const selected = document.getElementById(id);
            document.querySelectorAll("audio").forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            // Play selected audio
            selected.play();
        }
    </script>

</body>
</html>
